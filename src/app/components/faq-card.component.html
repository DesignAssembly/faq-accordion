<h1 class="headline"><img src="/images/icon-star.svg" alt="">FAQs</h1>
   
<div class="faq-accordion">
    @defer {
        @for (faq of faqs(); track faq.id) {
            <app-faq-item 
            class="faq-item"
            [faq] ='faq'
            [activeId] = 'activeId'
            [selfId] = 'faq.id'
            (opened)="activeId.set(activeId() === faq.id ? null : faq.id)"
            />
        }

    }@loading() {
        <div class="loading-spinner">
            <img src="/images/loading-spinner.svg" alt="Loading...">
        </div>
    }

</div>
